services:
  php:
    build: ./docker/php
    volumes:
      - .:/var/www/html
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - .:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php
    networks:
      - app

volumes:
  caddy_data:
  caddy_config:

networks:
  app:
