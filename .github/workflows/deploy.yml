name: Deploy a producción

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
        with:
          host: 72.60.245.72
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SP_TENANT_ID,SP_CLIENT_ID,SP_CLIENT_SECRET
          script: |
            cd "/opt/STAT - ADM MT"
            git fetch origin master
            git reset --hard origin/master
            git clean -fd
            printf "<?php\ndefine('SP_TENANT_ID',     '%s');\ndefine('SP_CLIENT_ID',     '%s');\ndefine('SP_CLIENT_SECRET', '%s');\n" "$SP_TENANT_ID" "$SP_CLIENT_ID" "$SP_CLIENT_SECRET" > api/config_private.php
            docker-compose build --no-cache
            docker-compose up -d
            echo "Deploy completado: $(date)"
