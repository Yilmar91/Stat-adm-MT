name: Deploy a producción

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.60.245.72
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd "/opt/STAT - ADM MT"
            git fetch origin master
            git reset --hard origin/master
            git clean -fd
            echo "Deploy completado: $(date)"
